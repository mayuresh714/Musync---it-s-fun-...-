<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080c" />
  <meta name="description" content="Pick a song and Musync plans stage lights for it. Watch the show on a big stage and save it as a video. Free demo." />
  <title>Musync: turn any song into a light show</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffb454' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 20.5 3.8 4.5M12 20.5V3M12 20.5l8.2-16'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./site/site.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="hero">
      <div class="container">
        <div>
          <h1 data-i18n="hero.title"></h1>
          <p class="lead" data-i18n="hero.sub"></p>
          <div class="cta-row">
            <a class="btn primary lg" href="/studio" data-i18n="hero.cta1"></a>
            <a class="btn lg" id="heroSignup" href="/signup" data-i18n="hero.cta2"></a>
          </div>
          <p class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3 8.3 7.5 9.5 4.5-1.2 7.5-4.9 7.5-9.5V6z"/><path d="m8.8 12 2.4 2.4 4-4.6"/></svg><span data-i18n="hero.note"></span></p>
        </div>
        <div class="hero-visual" role="img" data-i18n-aria="hero.alt">
          <svg class="beams" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs>
              <linearGradient id="hb1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb454" stop-opacity=".95"/><stop offset="1" stop-color="#ffb454" stop-opacity=".05"/></linearGradient>
              <linearGradient id="hb2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6ab7ff" stop-opacity=".95"/><stop offset="1" stop-color="#6ab7ff" stop-opacity=".05"/></linearGradient>
              <linearGradient id="hb3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6fa8" stop-opacity=".95"/><stop offset="1" stop-color="#ff6fa8" stop-opacity=".05"/></linearGradient>
              <radialGradient id="hglow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#ffb454" stop-opacity=".35"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient>
            </defs>
            <rect width="320" height="200" fill="url(#hglow)"/>
            <g style="transform-origin:160px 170px"><path class="beam" style="transform-origin:90px 170px" d="M90 170 L82 -20 L98 -20Z" fill="url(#hb2)"/><path class="beam" style="transform-origin:160px 170px" d="M160 170 L150 -20 L170 -20Z" fill="url(#hb1)"/><path class="beam" style="transform-origin:230px 170px" d="M230 170 L222 -20 L238 -20Z" fill="url(#hb3)"/><path class="beam" style="transform-origin:125px 170px" d="M125 170 L118 -20 L132 -20Z" fill="url(#hb1)" opacity=".7"/><path class="beam" style="transform-origin:195px 170px" d="M195 170 L188 -20 L202 -20Z" fill="url(#hb2)" opacity=".7"/></g>
            <rect y="170" width="320" height="30" fill="#05060a"/>
            <g fill="#0b0d14"><path d="M0 200V182q6-8 12 0t12 0 12-2 12 2 12-1 12 1 12-3 12 3 12-1 12 1 12-2 12 2 12-1 12 1 12-3 12 3 12-1 12 1 12-2 12 2 12-1 12 1 12-3 12 3 12-2 12 2 8-1V200z"/></g>
          </svg>
          <video id="heroVideo" muted loop playsinline preload="metadata" poster="/site/hero.jpg" hidden><source src="/site/hero.mp4" type="video/mp4" /></video>
        </div>
      </div>
    </section>

    <section class="section tight" id="how">
      <div class="container">
        <div class="section-head center"><h2 data-i18n="how.title"></h2><p class="lead" data-i18n="how.sub"></p></div>
        <div class="steps">
          <div class="step"><span class="num">1</span><div class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div><h3 data-i18n="how.1.t"></h3><p data-i18n="how.1.d"></p></div>
          <div class="step"><span class="num">2</span><div class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></div><h3 data-i18n="how.2.t"></h3><p data-i18n="how.2.d"></p></div>
          <div class="step"><span class="num">3</span><div class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z" fill="currentColor"/></svg></div><h3 data-i18n="how.3.t"></h3><p data-i18n="how.3.d"></p></div>
        </div>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="section-head"><h2 data-i18n="places.title"></h2><p class="lead" data-i18n="places.sub"></p></div>
        <div class="places">
          <a class="place" href="/studio?rig=hall"><img src="/site/places/hall.jpg" alt="" loading="lazy" width="640" height="480" /><span data-i18n="place.hall"></span></a>
          <a class="place" href="/studio?rig=dandiya"><img src="/site/places/dandiya.jpg" alt="" loading="lazy" width="640" height="480" /><span data-i18n="place.dandiya"></span></a>
          <a class="place" href="/studio?rig=concert"><img src="/site/places/concert.jpg" alt="" loading="lazy" width="640" height="480" /><span data-i18n="place.concert"></span></a>
          <a class="place" href="/studio?rig=club"><img src="/site/places/club.jpg" alt="" loading="lazy" width="640" height="480" /><span data-i18n="place.club"></span></a>
          <a class="place" href="/studio?rig=procession"><img src="/site/places/procession.jpg" alt="" loading="lazy" width="640" height="480" /><span data-i18n="place.procession"></span></a>
        </div>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="gear">
          <div><h2 data-i18n="gear.title"></h2><p class="lead" style="margin:12px 0 26px" data-i18n="gear.sub"></p><a class="btn primary" href="/equipment" data-i18n="gear.cta"></a></div>
          <div class="gear-chips" id="gearChips"></div>
        </div>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="section-head center"><h2 data-i18n="own.title"></h2></div>
        <div class="own">
          <div><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></div><h3 data-i18n="own.1.t"></h3><p data-i18n="own.1.d"></p></div>
          <div><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></div><h3 data-i18n="own.2.t"></h3><p data-i18n="own.2.d"></p></div>
          <div><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3 8.3 7.5 9.5 4.5-1.2 7.5-4.9 7.5-9.5V6z"/><path d="m8.8 12 2.4 2.4 4-4.6"/></svg></div><h3 data-i18n="own.3.t"></h3><p data-i18n="own.3.d"></p></div>
        </div>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="section-head center"><h2 data-i18n="faq.title"></h2></div>
        <div class="faq">
          <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
          <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
          <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
          <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
          <details><summary data-i18n="faq.5.q"></summary><p data-i18n="faq.5.a"></p></details>
        </div>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="cta-band"><h2 data-i18n="cta.title"></h2><p class="lead" data-i18n="cta.sub"></p>
          <div class="cta-row"><a class="btn primary lg" id="ctaSignup" href="/signup" data-i18n="hero.cta2"></a><a class="btn lg" href="/studio" data-i18n="cta.try"></a></div></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="./site/home.js"></script>
</body>
</html>
